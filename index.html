<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบสำรวจบุคลิกภาพ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1 class="title">แบบสำรวจบุคลิกภาพ</h1>
        <div class="cat-trail" aria-hidden="true">
            <div class="cat-walker">
                <svg class="survey-cat" viewBox="0 0 84 50" focusable="false">
                    <ellipse cx="43" cy="46" rx="33" ry="3" fill="#7763af" opacity=".16"/>
                    <path class="cat-tail" d="M24 30C12 32 6 25 9 17c1-3 4-5 7-5" fill="none" stroke="#a7644c" stroke-width="5" stroke-linecap="round"/>
                    <g stroke="#a7644c" stroke-width="5" stroke-linecap="round">
                        <path class="cat-leg" d="M27 36l-2 8M56 36l2 8"/>
                        <path class="cat-leg cat-leg-alt" d="M34 36l1 8M50 36l-1 8"/>
                    </g>
                    <path d="M19 32c0-8 8-13 20-13 11 0 18 6 18 13s-8 10-20 10c-11 0-18-4-18-10Z" fill="#e7a274"/>
                    <path d="m48 22 1-13 10 5 9-1 8-6 1 16c3 9-4 16-15 16-11 0-17-8-14-17Z" fill="#ffc493"/>
                    <path d="m52 17 0-4 5 3m12-1 5-4 0 6" fill="#e58a85"/>
                    <path d="M56 25v1m13-1v1m-8 4 2 1 2-1" fill="none" stroke="#493144" stroke-width="2" stroke-linecap="round"/>
                    <path d="M31 22l2 5m4-6 2 5m23-10v3" fill="none" stroke="#c67954" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M52 30h4m14 0h4" stroke="#ef9790" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
        <div class="notifications-container" aria-live="polite"></div>
        <p class="privacy-note">การส่งแบบสอบถามถือว่าคุณยินยอมให้จัดเก็บชื่อเล่น คำตอบทั้ง 10 ข้อ และวันเวลาที่ส่ง เพื่อนำไปวิเคราะห์ผลแบบสอบถาม กรุณาใช้ชื่อเล่นและหลีกเลี่ยงการกรอกชื่อจริงหรือข้อมูลติดต่อ</p>
        <form id="nickname-form">
            <label class="question-text" for="nickname">ชื่อเล่น</label>
            <input id="nickname" name="nickname" type="text" autocomplete="nickname" maxlength="40" required>
            <div class="nav-buttons">
                <button type="submit" class="submit-btn">เริ่มทำแบบสอบถาม</button>
            </div>
        </form>
        <form id="personalityForm" class="hidden" novalidate>
            <div id="progress-section">
                <p id="progress-label" class="progress-label"></p>
                <div class="progress-bar" role="progressbar" aria-label="ความคืบหน้า" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
            </div>
            <section class="question" id="questions-container" aria-live="polite"></section>
            <div class="nav-buttons">
                <button type="button" id="prev-btn" class="nav-btn hidden">ย้อนกลับ</button>
                <button type="button" id="next-btn" class="nav-btn hidden">ถัดไป</button>
                <button type="submit" id="survey-submit" class="submit-btn hidden">ส่งแบบสอบถาม</button>
            </div>
            <section id="results-container" class="hidden" tabindex="-1">
                <h2>ขอบคุณสำหรับการตอบคำถาม!</h2>
                <p>ผลวิเคราะห์เบื้องต้นจากคำตอบของคุณ</p>
                <div id="feedback-section"></div>
                <p id="save-status" class="save-status" role="status"></p>
            </section>
        </form>
        <button type="button" id="restart-btn" class="restart-btn hidden">ทำแบบสอบถามใหม่</button>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
